name = "borrowlend-production-monitor"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public, non-secret config — safe to commit.
[vars]
CONTRACT_ADDRESS = "0x52B8fBD5828900E6D73dF06C0c1dC509D4080e0D"
ALCHEMY_NETWORK = "polygon-mainnet"
EXPLORER_TX_BASE_URL = "https://polygonscan.com/tx"

[[d1_databases]]
binding = "DB"
database_name = "borrowlend-production-db"
database_id = "83bbed60-ce3f-4998-a1a4-8c5e648312cf"

# ---------------------------------------------------------------------------
# Development Worker (deployed from the `development` branch).
# `vars` and `d1_databases` are not inherited from the top level, so they're
# repeated here. Deploy with: wrangler deploy --env development
# ---------------------------------------------------------------------------
[env.development]
name = "contract-monitor"

[env.development.vars]
CONTRACT_ADDRESS = "0x52B8fBD5828900E6D73dF06C0c1dC509D4080e0D"
ALCHEMY_NETWORK = "polygon-mainnet"
EXPLORER_TX_BASE_URL = "https://polygonscan.com/tx"

# database_id is filled in by the deploy workflow, which looks it up by name
# (contract-monitor-db, UUID d65b5a01-4334-4ac6-…). Paste the full UUID here to
# deploy the dev Worker from a local machine.
[[env.development.d1_databases]]
binding = "DB"
database_name = "contract-monitor-db"
database_id = "RESOLVED_BY_DEPLOY_WORKFLOW"

# Secrets (set via `wrangler secret put <NAME>` — add `--env development` for the
# dev Worker — never committed):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ACTIVITY_CHANNEL_ID   (same value as TELEGRAM_ADMIN_GROUP_ID — one group for everything)
#   TELEGRAM_ADMIN_GROUP_ID
#   ALCHEMY_API_KEY
#   ALCHEMY_SIGNING_KEY
#   AUTH_EMAIL       (bootstrap login email, used only for the first-ever login)
#   AUTH_PASSWORD    (bootstrap login password, used only for the first-ever login)
#   AUTH_SECRET      (HMAC signing key for session tokens)
