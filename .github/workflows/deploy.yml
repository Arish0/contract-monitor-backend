# Deploys the Worker whenever code lands on a deploy branch:
#   development -> contract-monitor               (wrangler --env development)
#   production  -> borrowlend-production-monitor  (wrangler top-level config)
#
# Required repository secret: CLOUDFLARE_API_TOKEN
#   (permissions: Account / Workers Scripts: Edit, Account / D1: Edit)
name: Deploy to Cloudflare

on:
  push:
    branches: [development, production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 191f8ab39d6c8a5e1402ea83350f0ba6
      # Empty for production (top-level wrangler.toml config).
      WRANGLER_ENV: ${{ github.ref_name == 'development' && 'development' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Resolve development D1 database ID
        if: github.ref_name == 'development'
        run: |
          if ! grep -q 'RESOLVED_BY_DEPLOY_WORKFLOW' wrangler.toml; then
            echo "database_id already set in wrangler.toml"; exit 0
          fi
          DB_ID=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=contract-monitor-db" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[] | select(.name == "contract-monitor-db") | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database contract-monitor-db not found in account ${CLOUDFLARE_ACCOUNT_ID}"
            exit 1
          fi
          echo "Using contract-monitor-db ($DB_ID)"
          sed -i "s/RESOLVED_BY_DEPLOY_WORKFLOW/${DB_ID}/" wrangler.toml

      - name: Apply D1 schema
        # schema.sql is idempotent (IF NOT EXISTS / INSERT OR IGNORE), so it's safe on every deploy.
        run: npx wrangler d1 execute DB --remote --file=schema.sql ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy Worker
        run: npx wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
